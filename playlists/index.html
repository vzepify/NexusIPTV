<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nexus IPTV — Playlists</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand compact">
        <div class="logo">N</div>
        <div><h1>NEXUS IPTV</h1><p>Playlist manager</p></div>
      </div>
      <button id="logout" class="button ghost">Log out</button>
    </header>

    <section class="devicebar">
      <div><span class="muted">Roku Device ID</span><strong id="deviceId">—</strong></div>
      <div><span class="muted">Device Key</span><strong id="deviceKey">—</strong></div>
      <button id="refresh" class="button ghost">Refresh</button>
    </section>

    <section class="grid">
      <div class="card">
        <div class="eyebrow">ADD PLAYLIST</div>
        <h2>Xtream Codes</h2>
        <form id="playlistForm">
          <label for="name">Playlist name</label>
          <input id="name" required placeholder="My TV">

          <label for="server">Server URL</label>
          <input id="server" type="url" required placeholder="http://provider.example:8080">

          <label for="username">Username</label>
          <input id="username" required autocomplete="off">

          <label for="password">Password</label>
          <input id="password" type="password" required autocomplete="off">

          <button id="saveButton" class="button primary" type="submit">Save playlist</button>
        </form>
        <div id="formStatus" class="status"></div>
      </div>

      <div class="card">
        <div class="row-head">
          <div>
            <div class="eyebrow">YOUR PLAYLISTS</div>
            <h2>Saved sources</h2>
          </div>
          <span id="count" class="pill">0</span>
        </div>
        <div id="playlistList" class="playlist-list">
          <div class="empty">Loading playlists...</div>
        </div>
      </div>
    </section>

    <div id="globalStatus" class="status"></div>
    <footer>New playlists will appear on the Roku after its next playlist refresh.</footer>
  </main>
  <script src="../config.js"></script>
  <script src="../playlists.js"></script>
</body>
</html>
