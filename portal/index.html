<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus IPTV Portal</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand">NEXUS IPTV <span>PORTAL</span></div><div class="theme">Dark</div></header><main><section class="card"><h1>Add Playlist</h1><p class="muted">For Nexus IPTV Roku Player</p><label>Device Code</label><input id="deviceCode" placeholder="AB12CD34" autocomplete="off"></section><section class="card"><h2>Add Xtream Codes Playlist</h2><label>Playlist Name</label><input id="name" value="My Xtream Playlist"><label>Server URL</label><input id="server" placeholder="http://server.com:8080"><label>Username</label><input id="username" placeholder="username"><label>Password</label><input id="password" type="password" placeholder="password"><div class="row"><label class="check"><input id="hidden" type="checkbox"> Hide Playlist</label><label class="check"><input id="locked" type="checkbox"> Lock Playlist</label></div><details><summary>Advanced Options</summary><p class="muted">Protection is stored with the playlist for future player features.</p><label>Protection Password</label><input id="protection" type="password" placeholder="Optional"></details><button id="save">Save Xtream →</button><div id="status"></div></section><section class="card danger"><h2>Delete ALL Playlists on Device</h2><p class="muted">Removes all portal playlists for this device code.</p><button id="delete" class="dangerBtn">Delete All</button></section><section class="card"><h2>Get Playlist Information</h2><button id="load">Check Device →</button><pre id="result"></pre></section></main><script src="config.js"></script><script src="app.js"></script></body></html>
