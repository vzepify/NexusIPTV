<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nexus IPTV</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell narrow">
    <header class="brand">
      <div class="logo">N</div>
      <div>
        <h1>NEXUS IPTV</h1>
        <p>Roku playlist portal</p>
      </div>
    </header>

    <section class="card">
      <div class="eyebrow">ROKU DEVICE</div>
      <h2>Connect your Roku</h2>
      <p class="muted">Enter the Device ID and Device Key shown by the Nexus IPTV app on your Roku.</p>

      <form id="loginForm">
        <label for="deviceId">Device ID</label>
        <input id="deviceId" name="deviceId" autocomplete="off" spellcheck="false" placeholder="20E825000036" required>

        <label for="deviceKey">Device Key</label>
        <input id="deviceKey" name="deviceKey" autocomplete="off" spellcheck="false" placeholder="NEXUS-12345678" required>

        <button id="loginButton" class="button primary" type="submit">Connect Roku</button>
      </form>

      <div id="status" class="status" role="status"></div>
    </section>

    <footer>Nexus IPTV</footer>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
