<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus IPTV - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page narrow">
    <section class="brand">
      <div class="logo">N</div>
      <div><h1>NEXUS IPTV</h1><p>Playlist management portal</p></div>
    </section>

    <section class="card">
      <h2>Device Login</h2>
      <p class="muted">Enter the MAC address and device key shown by your Nexus IPTV app.</p>
      <form id="loginForm" novalidate>
        <label for="mac">MAC Address</label>
        <input id="mac" autocomplete="off" placeholder="00:11:22:33:44:55" required>
        <label for="deviceKey">Device Key</label>
        <input id="deviceKey" autocomplete="off" placeholder="NEXUS-XXXXXXXX" required>
        <button id="loginButton" type="submit">LOGIN <span>→</span></button>
      </form>
      <p id="status" class="status"></p>
    </section>
    <footer>Nexus IPTV</footer>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
